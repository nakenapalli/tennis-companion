spring:
  application:
    name: tennis-companion

  # Postgres. Defaults match docker-compose; override via env in any other environment.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tennis}
    username: ${DATABASE_USER:tennis}
    password: ${DATABASE_PASSWORD:tennis}

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only validates against it
    open-in-view: false         # don't hold a DB session open for the whole request
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Redis. Spring Boot accepts a single url; defaults match docker-compose.
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  # The upstream feed sends large payloads; only bind the fields we model.
  jackson:
    deserialization:
      fail-on-unknown-properties: false

# Actuator: expose health (with component detail) so /actuator/health reports db + redis status.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: ${SERVER_PORT:8080}

# One-time historical (Sackmann) load. Off by default; enable to ingest on startup:
#   .\gradlew.bat bootRun --args='--app.historical-load.enabled=true'
app:
  historical-load:
    enabled: ${HISTORICAL_LOAD_ENABLED:false}
    atp-dir: ${SACKMANN_ATP_DIR:data/tennis_atp}
    wta-dir: ${SACKMANN_WTA_DIR:data/tennis_wta}
    # seasons + ranking-files use the defaults in HistoricalLoadProperties

  # Upstream live feed (api-tennis.com); APIkey comes from .env (TENNIS_API_KEY).
  tennis-api:
    base-url: ${TENNIS_API_BASE_URL:https://api.api-tennis.com/tennis/}
    key: ${TENNIS_API_KEY:}

  # Scheduled polling ON by default (api-tennis Starter = 8,000 req/day; 60s live ≈ 1,440/day).
  # The live poller also no-ops when no key is set; tests disable via app.poll.enabled=false.
  poll:
    enabled: ${POLL_ENABLED:true}
    ranking-top-n: ${POLL_RANKING_TOP_N:100}
    live-interval: ${POLL_LIVE_INTERVAL:PT1M}
    recent-interval: ${POLL_RECENT_INTERVAL:PT15M} # today's completed matches (one get_fixtures call)

  # LLM (Anthropic) — the weekly digest + (Phase 6b) Tier-3 reconciliation. Key reuses the existing
  # ANTHROPIC_API_KEY when LLM_API_KEY isn't set. The job no-ops when the key is blank.
  llm:
    api-key: ${LLM_API_KEY:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: ${LLM_MODEL:claude-sonnet-4-6}
    tier3-model: ${LLM_TIER3_MODEL:claude-haiku-4-5}
    base-url: ${LLM_BASE_URL:https://api.anthropic.com}
    enabled: ${LLM_ENABLED:true}

  # Weekly "What's Worth Watching" digest schedule (Spring cron). Default Monday 09:00.
  digest:
    cron: ${DIGEST_CRON:0 0 9 * * MON}

  # Auth. The default secret is dev-only (HS256 needs >= 32 bytes) — set JWT_SECRET in prod.
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-please-a-32plus-byte-secret!!}

  # Optional admin bootstrap (set both to auto-create an admin for the gated /api/admin/** endpoints).
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
