# Local infrastructure for tennis-companion (design doc §13).
# The backend (Gradle) and frontend (npm) run on the host against these.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tc-postgres
    environment:
      POSTGRES_DB: tennis
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: tennis
    ports:
      - "5432:5432"
    volumes:
      - tc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennis -d tennis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tc-redis
    ports:
      - "6379:6379"
    volumes:
      - tc-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tc-pgdata:
  tc-redisdata:
